name: Push to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image
        run: |
          docker pull --platform linux/amd64 onlyoffice/documentserver:latest
          docker tag onlyoffice/documentserver:latest ghcr.io/${{ github.repository_owner }}/onlyoffice-ds:latest
          docker push ghcr.io/${{ github.repository_owner }}/onlyoffice-ds:latest
